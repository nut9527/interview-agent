server {
    listen       80 default_server;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 安全响应头 ──
    # A05: 防点击劫持
    add_header X-Frame-Options "DENY" always;
    # A03: 防 XSS 注入（CSP 白名单）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # A05: 防 MIME 嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # A02: 强制 HTTPS（生产环境生效）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 隐藏 Nginx 版本
    server_tokens off;

    # health check
    location = /healthz {
        default_type text/plain;
        return 200 "OK\n";
    }

    # API proxy — forward /api requests to the backend
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # 防止无尾斜杠的 /api 被 SPA fallback 当作前端路由。
    location = /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache static assets
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
