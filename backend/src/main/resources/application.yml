# ============================================================
# 职智达后端主配置。
# 带环境变量占位符的配置项可覆盖默认值，格式为 ${ENV_VAR:默认值}。
# 容器部署时通过环境变量调整对应参数。
# ============================================================

# ==================== 服务器端口 ====================
server:
  port: ${BACKEND_PORT:8080}

application:
  version: '@project.version@'

management:
  logging:
    export:
      otlp:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: ${AGENT_TRACE_EXPORT_ENABLED:false}
    sampling:
      probability: ${AGENT_TRACE_SAMPLE_PROBABILITY:0.1}
    baggage:
      enabled: false
    propagation:
      type: w3c
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${AGENT_TRACE_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          connect-timeout: 2s
          timeout: 2s
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
    rabbit:
      enabled: ${RABBITMQ_HEALTH_ENABLED:false}
  api-token: ${METRICS_TOKEN:}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        zhizhida.business: true

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# ==================== Spring 核心配置 ====================
spring:
  task:
    scheduling:
      pool:
        size: 4
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 500ms
      timeout: 300ms
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:zhizhida}
    password: ${RABBITMQ_PASSWORD:zhizhida-local}
    virtual-host: ${RABBITMQ_VHOST:/zhizhida-lab}
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 2
        max-concurrency: 2
  application:
    name: zhizhida-backend

  # 兼容从 backend/ 或项目根目录启动；同名配置以当前目录 .env 为准。
  # 其他工作目录可通过 SPRING_CONFIG_IMPORT 指定 .env 的绝对 file URI。
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"

  # 使用自定义令牌认证，排除默认的用户详情服务自动配置。
  # 登录凭据由数据库会话管理。
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  # ==================== 数据源配置（MySQL） ====================
  # 数据源连接、用户名和密码可通过对应的环境变量覆盖。
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:${MYSQL_PORT:3307}/${MYSQL_DATABASE:zhizhida}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=10000}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:zhizhida}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:zhizhida}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000

  # 由根目录启动脚本显式管理 MySQL；连接已有数据库时不要求安装 Docker。
  # 如需 Spring 自动管理，可显式开启；退出后端不会自动停止共享数据库。
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
      file: ${SPRING_DOCKER_COMPOSE_FILE:../docker-compose.yml}
      lifecycle-management: start-only

  # 表结构由 Flyway 版本化迁移管理
  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 102MB

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  configuration:
    # 数据库字段名 user_name 自动映射到 Java 实体属性 userName（驼峰转换）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键策略：使用数据库自增编号。
      id-type: auto
      # 逻辑删除字段名（标记删除而非物理删除）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== 结构化日志 ====================
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} requestId=%X{requestId:-none} logger=%logger{36} %kvp message=%msg%n"

# ==================== AI 配置 ====================
# 供应商配置可选 mock（离线模拟，无需密钥）或 deepseek（调用真实模型接口）。
ai:
  provider: ${AI_PROVIDER:mock}
  api-key: ${DEEPSEEK_API_KEY:${AI_API_KEY:}}
  resilience:
    # 同一 Redis namespace 下所有 API / Worker 共享，增加副本不会扩大预算。
    max-concurrent-calls: ${AI_MAX_CONCURRENT_CALLS:4}
    failure-threshold: ${AI_FAILURE_THRESHOLD:3}
    open-seconds: ${AI_CIRCUIT_OPEN_SECONDS:30}
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    thinking: ${DEEPSEEK_THINKING:}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:30}

# 可选的本地生态适配器；所有资源均需显式启用。
agent:
  retrieval:
    rrf-k: ${AGENT_RETRIEVAL_RRF_K:60}
    lexical-top-n: ${AGENT_RETRIEVAL_LEXICAL_TOP_N:30}
    vector-top-n: ${AGENT_RETRIEVAL_VECTOR_TOP_N:30}
    max-per-heading: ${AGENT_RETRIEVAL_MAX_PER_HEADING:2}
  vector:
    enabled: ${AGENT_VECTOR_ENABLED:false}
    worker-enabled: ${AGENT_VECTOR_WORKER_ENABLED:true}
    poll-ms: ${AGENT_VECTOR_POLL_MS:5000}
    embedding-url: ${AGENT_VECTOR_EMBEDDING_URL:http://127.0.0.1:18092/v1}
    embedding-model: ${AGENT_VECTOR_EMBEDDING_MODEL:local}
    embedding-version: ${AGENT_VECTOR_EMBEDDING_VERSION:chunks-v1}
    dimension: ${AGENT_VECTOR_DIMENSION:384}
    pg-host: ${AGENT_VECTOR_PG_HOST:127.0.0.1}
    pg-port: ${AGENT_VECTOR_PG_PORT:5432}
    pg-database: ${AGENT_VECTOR_PG_DATABASE:agent_vectors}
    pg-user: ${AGENT_VECTOR_PG_USER:agent_vectors}
    pg-password: ${AGENT_VECTOR_PG_PASSWORD:}

# 面试任务的循环策略与规划器开关。
interview:
  prompts:
    # 留空使用内置模板；外部完整模板包在启动时加载，修改后需重启。
    directory: ${INTERVIEW_PROMPT_DIRECTORY:}
  runs:
    worker-enabled: ${INTERVIEW_RUNS_WORKER_ENABLED:true}
    scan-ms: ${INTERVIEW_RUNS_SCAN_MS:2000}
    expire-ms: ${INTERVIEW_RUNS_EXPIRE_MS:2000}
    events:
      max-connections: ${INTERVIEW_SSE_MAX_CONNECTIONS:64}
      max-connections-per-owner: ${INTERVIEW_SSE_MAX_CONNECTIONS_PER_OWNER:3}
      poll-ms: ${INTERVIEW_SSE_POLL_MS:1000}
    capacity:
      max-active: ${INTERVIEW_RUNS_MAX_ACTIVE:4}
      max-outstanding: ${INTERVIEW_RUNS_MAX_OUTSTANDING:20}
      queue-seconds: ${INTERVIEW_RUNS_QUEUE_SECONDS:10}
    loop-policy: ${INTERVIEW_RUNS_LOOP_POLICY:B0}
    decision-protocol: ${INTERVIEW_RUNS_DECISION_PROTOCOL:legacy}
  agent:
    adaptive-routing-enabled: ${INTERVIEW_ADAPTIVE_ROUTING_ENABLED:false}

learning:
  # 新命令使用练习工具时，发布开关与用户偏好必须同时允许。
  practice-tools-enabled: ${LEARNING_PRACTICE_TOOLS_ENABLED:false}

# 默认保留数据库派发；协调 Redis 始终必需，缓存与 MQ 可选。
app:
  redis:
    namespace: ${REDIS_NAMESPACE:zhizhida:dev}
    cache:
      host: ${REDIS_CACHE_HOST:127.0.0.1}
      port: ${REDIS_CACHE_PORT:6380}
      username: ${REDIS_CACHE_USERNAME:}
      password: ${REDIS_CACHE_PASSWORD:}
      database: ${REDIS_CACHE_DATABASE:0}
      ssl: ${REDIS_CACHE_SSL:false}
      connect-timeout: ${REDIS_CACHE_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_CACHE_TIMEOUT:300ms}
    rate-limit:
      # AI / SSE / 清理协调及提交保护共用 noeviction Redis，不得使用缓存实例。
      host: ${REDIS_RATE_HOST:${REDIS_HOST:127.0.0.1}}
      port: ${REDIS_RATE_PORT:${REDIS_PORT:6379}}
      username: ${REDIS_RATE_USERNAME:}
      password: ${REDIS_RATE_PASSWORD:${REDIS_PASSWORD:}}
      database: ${REDIS_RATE_DATABASE:0}
      ssl: ${REDIS_RATE_SSL:false}
      connect-timeout: ${REDIS_RATE_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_RATE_TIMEOUT:300ms}
  cache:
    questions:
      enabled: ${QUESTION_CACHE_ENABLED:false}
  rate-limit:
    redis:
      enabled: ${REDIS_RATE_LIMIT_ENABLED:false}
      limit: ${REDIS_SUBMISSION_LIMIT:10}
      window-ms: ${REDIS_SUBMISSION_WINDOW_MS:10000}
  run-dispatch:
    mode: ${RUN_DISPATCH_MODE:database}
    concurrency: ${RUN_DISPATCH_CONCURRENCY:2}
  outbox:
    publisher:
      enabled: ${RUN_OUTBOX_PUBLISHER_ENABLED:true}
      interval-ms: ${RUN_OUTBOX_PUBLISHER_INTERVAL_MS:500}
      batch-size: ${RUN_OUTBOX_PUBLISHER_BATCH_SIZE:8}
      batch-budget-ms: ${RUN_OUTBOX_PUBLISHER_BATCH_BUDGET_MS:100}
  run-recovery:
    enabled: ${RUN_RECOVERY_ENABLED:true}

knowledge:
  dispatch:
    mode: ${KNOWLEDGE_DISPATCH_MODE:local}
    namespace: ${KNOWLEDGE_DISPATCH_NAMESPACE:zhizhida.knowledge}
  import:
    shared-directory: ${KNOWLEDGE_IMPORT_SHARED_DIRECTORY:${user.dir}/tmp/knowledge-shared}
    concurrency: ${KNOWLEDGE_IMPORT_CONCURRENCY:2}
    timeout-seconds: ${KNOWLEDGE_IMPORT_TIMEOUT_SECONDS:180}
  index:
    concurrency: ${KNOWLEDGE_INDEX_CONCURRENCY:1}

# PDFBox 字体映射缓存目录，避免在用户主目录生成隐式文件。
resume:
  import:
    font-cache-dir: ${RESUME_PDFBOX_FONT_CACHE_DIR:${user.dir}/tmp/pdfbox-font-cache}

# 公共演示入口：每次登录复制一个独立、限时的用户空间，避免访客数据互相覆盖。
demo:
  enabled: ${DEMO_ENABLED:true}
  sandbox-ttl-hours: ${DEMO_SANDBOX_TTL_HOURS:4}
  max-active-sandboxes: ${DEMO_MAX_ACTIVE_SANDBOXES:100}
  cleanup:
    batch-size: ${DEMO_CLEANUP_BATCH_SIZE:25}
    interval-ms: ${DEMO_CLEANUP_INTERVAL_MS:60000}

# 数据库固定时间窗额度；所有实例使用同一个 MySQL，不依赖 JVM 本地计数。
quota:
  register:
    per-minute: ${QUOTA_REGISTER_PER_MINUTE:3}
    per-day: ${QUOTA_REGISTER_PER_DAY:10}
  login:
    per-minute: ${QUOTA_LOGIN_PER_MINUTE:10}
    per-day: ${QUOTA_LOGIN_PER_DAY:60}
  demo:
    per-hour: ${QUOTA_DEMO_PER_HOUR:6}
    per-day: ${QUOTA_DEMO_PER_DAY:6}
  ai:
    per-minute: ${QUOTA_AI_PER_MINUTE:5}
    units-per-day: ${QUOTA_AI_UNITS_PER_DAY:40}
    global-units-per-day: ${QUOTA_AI_GLOBAL_UNITS_PER_DAY:400}
