# Worker 领取任务并恢复过期租约，HTTP 仅提供健康检查和需鉴权的指标接口。
app:
  runtime:
    role: worker
  cache.questions.enabled: true
  rate-limit.redis.enabled: false
  run-dispatch.mode: rocketmq
  outbox.publisher.enabled: false
  run-recovery.enabled: true
interview.runs:
  worker-enabled: true
agent.vector.worker-enabled: true
learning.worker-enabled: true
knowledge:
  dispatch:
    mode: rocketmq
    publisher-enabled: false
    index-scan-ms: 60000
  import.worker-enabled: true
demo.cleanup.enabled: true
quota.cleanup.enabled: true
ai.resilience.max-concurrent-calls: ${AI_MAX_CONCURRENT_CALLS:4}
