# API 先将任务持久化，再发布执行通知。客户端通过任务查询或 SSE 跟踪进度。
app:
  runtime:
    role: api
  cache.questions.enabled: true
  rate-limit.redis.enabled: true
  run-dispatch.mode: rocketmq
  outbox.publisher.enabled: true
  run-recovery.enabled: false
interview.runs:
  worker-enabled: false
agent.vector.worker-enabled: false
learning.worker-enabled: false
knowledge:
  dispatch:
    mode: rocketmq
    publisher-enabled: true
    index-scan-ms: 60000
  import.worker-enabled: false
demo.cleanup.enabled: false
quota.cleanup.enabled: false
ai.resilience.max-concurrent-calls: ${AI_MAX_CONCURRENT_CALLS:4}
