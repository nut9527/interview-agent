# 集成测试使用独立配置，不导入应用主配置或开发者的本地私密配置。
server:
  port: 0
application:
  version: integration-test
spring:
  application:
    name: zhizhida-test
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${IT_DATABASE_URL:jdbc:mysql://127.0.0.1:13307/zhizhida_test?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=10000}
    username: ${IT_DATABASE_USERNAME:it_user}
    password: ${IT_DATABASE_PASSWORD:it_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 0
      maximum-pool-size: 16
      connection-timeout: 3000
  docker:
    compose:
      enabled: false
  flyway:
    enabled: true
    connect-retries: 10
    validate-on-migrate: true
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 32MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
ai:
  provider: mock
  api-key: ''
  deepseek:
    base-url: http://127.0.0.1:1
    model: test-model
    timeout-seconds: 2
jobs:
  refresh:
    worker-enabled: false
  remote:
    enabled: false
resume:
  import:
    font-cache-dir: ${user.dir}/target/pdfbox-font-cache
demo:
  cleanup:
    enabled: false
quota:
  register:
    per-minute: 10000
    per-day: 100000
  cleanup:
    enabled: false
  login:
    per-minute: 10000
    per-day: 100000
  demo:
    per-hour: 1000
    per-day: 10000
  ai:
    per-minute: 10000
    units-per-day: 100000
    global-units-per-day: 1000000
  refresh:
    per-day: 1000
    global-per-day: 10000
logging:
  level:
    root: WARN
    cn.edu.whu.zhizhida: INFO

interview:
  agent:
    adaptive-routing-enabled: false
  runs:
    loop-policy: B0
    decision-protocol: phased-v2
    worker-enabled: false
learning:
  worker-enabled: false

app:
  rocketmq:
    endpoints: ${ROCKETMQ_ENDPOINTS:127.0.0.1:8081}
    resource-prefix: ${ROCKETMQ_RESOURCE_PREFIX:zhizhida-it}
    receive-wait-ms: ${ROCKETMQ_RECEIVE_WAIT_MS:200}
    access-key: ${ROCKETMQ_ACCESS_KEY:}
    secret-key: ${ROCKETMQ_SECRET_KEY:}
    tls: ${ROCKETMQ_TLS_ENABLED:false}
  redis:
    # 将测试使用的并发许可和清理游标与开发环境隔离。
    namespace: zhizhida:it
    cache:
      host: ${REDIS_CACHE_HOST:127.0.0.1}
      port: ${REDIS_CACHE_PORT:6380}
      password: ${REDIS_CACHE_PASSWORD:}
    rate-limit:
      host: ${REDIS_RATE_HOST:${REDIS_HOST:127.0.0.1}}
      port: ${REDIS_RATE_PORT:${REDIS_PORT:6379}}
      password: ${REDIS_RATE_PASSWORD:${REDIS_PASSWORD:}}
