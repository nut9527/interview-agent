# 显式启用中间件时，与基础 Compose 文件叠加使用。
services:
  redis:
    profiles: ["app", "middleware"]
  redis-cache:
    profiles: ["app", "middleware"]
  mqinit:
    profiles: ["app", "middleware"]
  backend:
    volumes:
      - ./.runtime/knowledge-shared:/app/data/knowledge-imports
    depends_on:
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      mqinit:
        condition: service_completed_successfully
    environment:
      QUESTION_CACHE_ENABLED: "true"
      REDIS_RATE_LIMIT_ENABLED: "true"
      RUN_DISPATCH_MODE: rocketmq
      INTERVIEW_RUNS_WORKER_ENABLED: "true"
      RUN_OUTBOX_PUBLISHER_ENABLED: "true"
      RUN_RECOVERY_ENABLED: "true"
      KNOWLEDGE_DISPATCH_MODE: rocketmq
      KNOWLEDGE_IMPORT_SHARED_DIRECTORY: /app/data/knowledge-imports
      KNOWLEDGE_DISPATCH_INDEX_SCAN_MS: "60000"
